[package]
name = "castle-eval"
version = "0.1.0"
edition = "2021"
description = "Castle's test target: a small axum service with tests and one known-vulnerable dependency."
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned on purpose: GHSA-m5pq-gvj9-9vr8 / RUSTSEC-2022-0013 (fixed in 1.5.5).
regex = "=1.5.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
