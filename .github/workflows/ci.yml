name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every third-party action is pinned to a commit SHA
        run: |
          bad=$(grep -rhoE 'uses: [^ ]+' .github/workflows | grep -vE '@[0-9a-f]{40}( |$)' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings
      - run: cargo test
