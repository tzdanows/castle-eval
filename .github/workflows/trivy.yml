# Castle reference workflow: Trivy filesystem scan uploaded as SARIF, so findings arrive
# as code-scanning alerts and Castle picks them up like any other.
name: trivy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
  security-events: write
jobs:
  fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
