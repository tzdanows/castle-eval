# Castle reference workflow: Trivy filesystem scan uploaded as SARIF, so findings arrive
# as code-scanning alerts and Castle picks them up like any other.
name: trivy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
  security-events: write
jobs:
  fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
