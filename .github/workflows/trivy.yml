# Castle reference workflow: Trivy filesystem scan uploaded as SARIF, so findings arrive
# as code-scanning alerts and Castle picks them up like any other.
name: trivy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
  security-events: write
jobs:
  fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
